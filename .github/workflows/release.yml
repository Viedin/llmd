name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      # Fixed asset names, so the README's releases/latest/download/ links never change.
      - run: mv "$(npm pack | tail -1)" llmd.tgz
      - run: npx @vscode/vsce package --no-rewrite-relative-links --out llmd.vsix
      - run: gh release create "$GITHUB_REF_NAME" llmd.tgz llmd.vsix --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
